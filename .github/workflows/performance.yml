name: Performance smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  k6-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start ServeRest API
        run: |
          npm run api &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/usuarios > /dev/null && exit 0
            sleep 1
          done
          echo "ServeRest did not start" && exit 1

      - uses: grafana/setup-k6-action@v1

      - name: Run smoke test (fails if any NFR threshold is broken)
        run: k6 run tests/smoke.test.js -e BASE_URL=http://localhost:3000
        env:
          K6_WEB_DASHBOARD: 'true'
          K6_WEB_DASHBOARD_EXPORT: reports/smoke-report.html

      - name: Upload k6 HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-report
          path: reports/smoke-report.html
